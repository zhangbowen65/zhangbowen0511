<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>任务三 · 图片查看器：双指缩放 + 双击放大 + 拖动 · zbw511</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    background:radial-gradient(circle at 50% 0%,#1e293b 0%,#0b1120 55%,#060a12 100%);
    color:#e5e7eb;min-height:100vh;
  }
  .zbw511_page{max-width:560px;margin:0 auto;padding:22px 18px calc(36px + env(safe-area-inset-bottom))}

  .zbw511_badge{display:inline-block;font-size:12px;letter-spacing:2px;color:#fbbf24;
    border:1px solid rgba(251,191,36,.45);background:rgba(251,191,36,.1);
    padding:4px 12px;border-radius:999px;margin-bottom:12px}
  .zbw511_head h1{font-size:21px;line-height:1.5}
  .zbw511_head h1 b{color:#fbbf24}
  .zbw511_head p{font-size:13px;color:#94a3b8;line-height:1.9;margin-top:8px}

  /* 查看器容器：
     overflow:hidden 把放大后跑到容器外的部分裁掉；
     touch-action:none 关闭浏览器默认的滚动/双击缩放，手势全部交给 JS；
     user-select:none 防止长按选中图片 */
  .zbw511_zoom-stage{
    position:relative;width:100%;height:60vh;min-height:320px;margin-top:18px;
    overflow:hidden;border-radius:18px;background:#0b1220;
    touch-action:none;
    user-select:none;-webkit-user-select:none;
    box-shadow:0 18px 40px rgba(0,0,0,.55);
  }

  /* 图片：transform-origin 设为左上角，平移/缩放都以容器左上角为原点，计算最直观 */
  .zbw511_zoom-img{
    width:100%;height:100%;object-fit:cover;display:block;
    transform-origin:0 0;
    will-change:transform;
  }

  .zbw511_zoom-bar{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .zbw511_scale{font-size:14px;color:#fbbf24;font-weight:bold;letter-spacing:1px}
  .zbw511_reset{
    border:1px solid rgba(251,191,36,.5);background:rgba(251,191,36,.12);color:#fbbf24;
    font-size:13px;padding:8px 18px;border-radius:999px;cursor:pointer;font-family:inherit;
  }

  .zbw511_tips{margin-top:16px;font-size:13px;color:#94a3b8;line-height:2}
  .zbw511_tips li{list-style:none}

  .zbw511_author{margin-top:18px;font-size:12.5px;color:#64748b;text-align:center}
  .zbw511_back{display:block;text-align:center;margin-top:16px;text-decoration:none;color:#93c5fd;font-size:14px}
</style>
</head>
<body>
<div class="zbw511_page">

  <div class="zbw511_head">
    <span class="zbw511_badge">任务三 · 图片查看器</span>
    <h1>双指缩放 · <b>双击放大</b> · 单指拖动</h1>
    <p>双指缩放请用手机打开；桌面端可直接双击图片在 1x / 2x 之间切换。</p>
  </div>

  <!-- 查看器：图片放在这个 overflow:hidden 的容器里 -->
  <div class="zbw511_zoom-stage" id="zbw511_zoomStage">
    <img class="zbw511_zoom-img" id="zbw511_zoomImg"
         src="swiper-imgs/adora_1.jpg" alt="爱达·魔都号 展品图">
  </div>

  <div class="zbw511_zoom-bar">
    <span class="zbw511_scale" id="zbw511_scale">1.0x</span>
    <button class="zbw511_reset" id="zbw511_reset" type="button">还原 1x</button>
  </div>

  <ul class="zbw511_tips">
    <li>· 双指捏合：在 1x ~ 4x 之间缩放，以两指中点为基准</li>
    <li>· 双击图片：1x ⇄ 2x 切换（带 0.25s 过渡）</li>
    <li>· 放大后单指拖动查看细节，松手自动回弹到边界内</li>
  </ul>

  <p class="zbw511_author">姓名：张博文　学号：511</p>
  <a class="zbw511_back" href="index.html">← 返回首页</a>
</div>

<script>
(function () {
  "use strict";

  /* ========== 1. 元素与状态 ========== */
  var zbw511_stage     = document.getElementById("zbw511_zoomStage");
  var zbw511_img       = document.getElementById("zbw511_zoomImg");
  var zbw511_scaleText = document.getElementById("zbw511_scale");
  var zbw511_resetBtn  = document.getElementById("zbw511_reset");

  var zbw511_scale = 1;   // 当前缩放倍数
  var zbw511_tx = 0;      // 当前横向平移量（px）
  var zbw511_ty = 0;      // 当前纵向平移量（px）
  var zbw511_min = 1;     // 最小倍数：原始大小
  var zbw511_max = 4;     // 最大倍数

  var zbw511_mode = "";        // 当前手势："pinch" 双指缩放 / "pan" 单指拖动
  var zbw511_startDist = 0;    // 双指按下时的初始间距
  var zbw511_startScale = 1;   // 双指按下时的初始倍数
  var zbw511_anchorX = 0;      // 缩放基准点（两指中点，相对容器左上角）
  var zbw511_anchorY = 0;
  var zbw511_originX = 0;      // 本次手势开始时的平移量
  var zbw511_originY = 0;
  var zbw511_panX = 0;         // 单指按下时的屏幕坐标
  var zbw511_panY = 0;
  var zbw511_tapTime = 0;      // 上一次轻点的时间戳，用于判断双击
  var zbw511_tapX = 0;
  var zbw511_tapY = 0;

  /* ========== 2. 基础工具 ========== */

  // 把 tx / ty / scale 写进 transform，并同步右下角的倍数指示器
  function zbw511_apply(zbw511_animate) {
    zbw511_img.style.transition = zbw511_animate ? "transform .25s ease" : "none";
    zbw511_img.style.transform =
      "translate(" + zbw511_tx + "px," + zbw511_ty + "px) scale(" + zbw511_scale + ")";
    zbw511_scaleText.textContent = zbw511_scale.toFixed(1) + "x";
  }

  // 边界限制：放大后不允许拖出空白，比容器小时自动居中（1x 时就等于居中）
  function zbw511_clamp() {
    var zbw511_w = zbw511_stage.clientWidth;
    var zbw511_h = zbw511_stage.clientHeight;
    var zbw511_iw = zbw511_w * zbw511_scale;   // 图片缩放后的实际宽度
    var zbw511_ih = zbw511_h * zbw511_scale;   // 图片缩放后的实际高度

    if (zbw511_iw <= zbw511_w) {
      zbw511_tx = (zbw511_w - zbw511_iw) / 2;          // 比容器窄：水平居中，1x 时不能拖动
    } else {
      zbw511_tx = Math.max(zbw511_w - zbw511_iw, Math.min(0, zbw511_tx));
    }

    if (zbw511_ih <= zbw511_h) {
      zbw511_ty = (zbw511_h - zbw511_ih) / 2;
    } else {
      zbw511_ty = Math.max(zbw511_h - zbw511_ih, Math.min(0, zbw511_ty));
    }
  }

  // 两根手指之间的直线距离
  function zbw511_dist(zbw511_t1, zbw511_t2) {
    var zbw511_dx = zbw511_t1.clientX - zbw511_t2.clientX;
    var zbw511_dy = zbw511_t1.clientY - zbw511_t2.clientY;
    return Math.sqrt(zbw511_dx * zbw511_dx + zbw511_dy * zbw511_dy);
  }

  // 两指中点：换算成相对容器左上角的坐标
  function zbw511_mid(zbw511_t1, zbw511_t2) {
    var zbw511_r = zbw511_stage.getBoundingClientRect();
    return {
      x: (zbw511_t1.clientX + zbw511_t2.clientX) / 2 - zbw511_r.left,
      y: (zbw511_t1.clientY + zbw511_t2.clientY) / 2 - zbw511_r.top
    };
  }

  /* ========== 3. 双击：1x ⇄ 2x ========== */
  function zbw511_doubleTap(zbw511_clientX, zbw511_clientY) {
    var zbw511_r = zbw511_stage.getBoundingClientRect();
    var zbw511_px = zbw511_clientX - zbw511_r.left;
    var zbw511_py = zbw511_clientY - zbw511_r.top;

    // 已经放大过就还原，否则放大到 2 倍
    var zbw511_next = zbw511_scale > 1.05 ? zbw511_min : 2;

    // 以双击点为基准缩放，保证"双击哪里放大哪里"
    var zbw511_k = zbw511_next / zbw511_scale;
    zbw511_tx = zbw511_px - (zbw511_px - zbw511_tx) * zbw511_k;
    zbw511_ty = zbw511_py - (zbw511_py - zbw511_ty) * zbw511_k;
    zbw511_scale = zbw511_next;

    zbw511_clamp();
    zbw511_apply(true);   // 带 0.25s 过渡
  }

  /* ========== 4. 手势处理 ========== */

  // ① 按下：双指记录间距与中点；单指记录拖动起点
  zbw511_stage.addEventListener("touchstart", function (zbw511_event) {
    if (zbw511_event.touches.length >= 2) {
      zbw511_mode       = "pinch";
      zbw511_startDist  = zbw511_dist(zbw511_event.touches[0], zbw511_event.touches[1]);
      zbw511_startScale = zbw511_scale;

      var zbw511_m = zbw511_mid(zbw511_event.touches[0], zbw511_event.touches[1]);
      zbw511_anchorX = zbw511_m.x;
      zbw511_anchorY = zbw511_m.y;
      zbw511_originX = zbw511_tx;
      zbw511_originY = zbw511_ty;
    } else if (zbw511_event.touches.length === 1) {
      zbw511_mode = "pan";
      zbw511_panX = zbw511_event.touches[0].clientX;
      zbw511_panY = zbw511_event.touches[0].clientY;
      zbw511_tapX = zbw511_panX;
      zbw511_tapY = zbw511_panY;
      zbw511_originX = zbw511_tx;
      zbw511_originY = zbw511_ty;
    }
  }, { passive: false });

  // ② 移动：双指按距离比例缩放；单指且已放大时拖动
  zbw511_stage.addEventListener("touchmove", function (zbw511_event) {
    zbw511_event.preventDefault();   // 关键：不让页面跟着一起滚动 / 触发浏览器缩放

    if (zbw511_mode === "pinch" && zbw511_event.touches.length >= 2) {
      if (zbw511_startDist <= 0) { return; }   // 两指重合时防除零

      var zbw511_nowDist = zbw511_dist(zbw511_event.touches[0], zbw511_event.touches[1]);
      var zbw511_ratio   = zbw511_nowDist / zbw511_startDist;
      var zbw511_next    = zbw511_startScale * zbw511_ratio;
      zbw511_next = Math.max(zbw511_min, Math.min(zbw511_max, zbw511_next));  // 夹在 1~4 倍

      // —— 缩放不跳的核心公式 ——
      // 缩放前，基准点 anchor 下对应的图片坐标 p = (anchor - origin) / startScale
      // 缩放后要满足 anchor = p * next + tx
      // 代入整理得：tx = anchor - (anchor - origin) * (next / startScale)
      // ty 同理。这样两指中点下的那个像素始终停在手指下方，图片不会"跳走"。
      var zbw511_k = zbw511_next / zbw511_startScale;
      zbw511_tx = zbw511_anchorX - (zbw511_anchorX - zbw511_originX) * zbw511_k;
      zbw511_ty = zbw511_anchorY - (zbw511_anchorY - zbw511_originY) * zbw511_k;
      zbw511_scale = zbw511_next;

      zbw511_clamp();        // 缩放的同时限制边界
      zbw511_apply(false);   // 双指过程中不加过渡，做到跟手

    } else if (zbw511_mode === "pan" && zbw511_event.touches.length === 1 && zbw511_scale > 1) {
      // 只有放大状态才允许拖动，1x 时图片是钉死的
      zbw511_tx = zbw511_originX + (zbw511_event.touches[0].clientX - zbw511_panX);
      zbw511_ty = zbw511_originY + (zbw511_event.touches[0].clientY - zbw511_panY);
      zbw511_clamp();
      zbw511_apply(false);
    }
  }, { passive: false });

  // ③ 松手：回弹到合法边界，并判断是不是双击的第二下
  zbw511_stage.addEventListener("touchend", function (zbw511_event) {
    if (zbw511_event.touches.length === 0) {
      zbw511_clamp();
      zbw511_apply(true);   // 松手回弹带过渡，避免硬切

      var zbw511_t    = zbw511_event.changedTouches[0];
      var zbw511_move = Math.abs(zbw511_t.clientX - zbw511_tapX) +
                        Math.abs(zbw511_t.clientY - zbw511_tapY);

      if (zbw511_move < 20) {                       // 位移很小才算"轻点"
        var zbw511_now = Date.now();
        if (zbw511_now - zbw511_tapTime < 300) {    // 300ms 内第二次轻点 = 双击
          zbw511_doubleTap(zbw511_t.clientX, zbw511_t.clientY);
          zbw511_tapTime = 0;
        } else {
          zbw511_tapTime = zbw511_now;
        }
      }

      zbw511_mode = "";

    } else if (zbw511_event.touches.length === 1) {
      // 双指松开一指：无缝切回单指拖动，重新记录起点
      zbw511_mode = "pan";
      zbw511_panX = zbw511_event.touches[0].clientX;
      zbw511_panY = zbw511_event.touches[0].clientY;
      zbw511_originX = zbw511_tx;
      zbw511_originY = zbw511_ty;
    }
  }, { passive: false });

  /* ========== 5. 按钮 / 屏幕旋转 ========== */

  // 还原到 1x 并居中
  zbw511_resetBtn.addEventListener("click", function () {
    zbw511_scale = 1;
    zbw511_tx = 0;
    zbw511_ty = 0;
    zbw511_clamp();
    zbw511_apply(true);
  });

  // 旋转屏幕 / 改变窗口大小：重新计算边界，缩放倍数和位置都不丢失
  function zbw511_relayout() {
    zbw511_clamp();
    zbw511_apply(false);
  }
  window.addEventListener("resize", zbw511_relayout);
  window.addEventListener("orientationchange", function () {
    setTimeout(zbw511_relayout, 250);   // 等浏览器完成旋转再算
  });

  // 桌面端（无触摸设备）双击也能放大，方便演示
  if (!("ontouchstart" in window)) {
    zbw511_stage.addEventListener("dblclick", function (zbw511_event) {
      zbw511_doubleTap(zbw511_event.clientX, zbw511_event.clientY);
    });
  }

  /* ========== 6. 初始化 ========== */
  zbw511_clamp();
  zbw511_apply(false);
})();
</script>
</body>
</html>
