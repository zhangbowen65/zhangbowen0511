<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抓小球</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶部信息栏：实时展示得分与倒计时 -->
  <header id="zbw511_topbar">
    <span class="zbw511_stat">得分：<b id="zbw511_score-value">0</b></span>
    <span class="zbw511_stat">剩余时间：<b id="zbw511_timer-value">02:00</b></span>
  </header>

  <!-- 游戏区：小球与点击事件容器 -->
  <main id="zbw511_game-area">
    <!-- 小球图层 -->
    <div id="zbw511_balls-layer"></div>

    <!-- 遮罩层：未开始显示开始按钮，结束后显示结算面板 -->
    <div id="zbw511_overlay">
      <div id="zbw511_start-view">
        <button id="zbw511_start-btn" class="zbw511_btn" type="button">开始游戏</button>
      </div>

      <div id="zbw511_result-panel" class="zbw511_hidden">
        <h2 class="zbw511_result-title">游戏结束</h2>
        <p class="zbw511_result-line">本局得分：<b id="zbw511_final-score">0</b></p>
        <p class="zbw511_result-line">历史最高分：<b id="zbw511_best-score">0</b></p>
        <button id="zbw511_restart-btn" class="zbw511_btn" type="button">再来一局</button>
      </div>
    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
